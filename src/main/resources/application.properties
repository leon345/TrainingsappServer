quarkus.application.name=trainingsapp-server
# Version kommt aus der pom.xml (Quarkus setzt quarkus.application.version automatisch)

# Kein globaler Root-Pfad: die Version steht im Pfad jeder Ressource (/v1/...),
# damit /v1 und spaetere Versionen parallel betrieben werden koennen.

# OpenAPI
# Dokument: /q/openapi (YAML) bzw. /q/openapi?format=json
# Swagger UI: /q/swagger-ui (standardmaessig nur im Dev- und Test-Modus)
mp.openapi.extensions.smallrye.info.title=Trainingsapp API
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
mp.openapi.extensions.smallrye.info.description=REST-API des Trainingsapp-Backends
# Das Dokument wird beim Build zusaetzlich als Datei abgelegt (target/openapi/)
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# ---------------------------------------------------------------------------
# Persistenz (E9): PostgreSQL, Hibernate ORM mit Panache, Flyway
# Details: docs/persistenz.md
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# Prod: KEINE Zugangsdaten in dieser Datei. URL, Benutzer und Passwort kommen
# ausschliesslich aus Umgebungsvariablen:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
# Fehlen sie, startet die Anwendung im Prod-Profil nicht (Flyway braucht die Datenbank).

# Flyway: Migrationen aus src/main/resources/db/migration werden beim Start angewendet
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Hibernate ORM: das Schema gehoert allein Flyway; Hibernate prueft es nur
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.jdbc.timezone=UTC

# Dev: lokale PostgreSQL-Instanz (Docker/Podman fuer Dev Services nicht vorhanden, siehe docs/persistenz.md).
# Nur fuer die lokale Entwicklung, kein Geheimnis.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/trainingsapp
%dev.quarkus.datasource.username=trainingsapp
%dev.quarkus.datasource.password=trainingsapp

# Test: eigene lokale Testdatenbank, wird vor jedem Testlauf geleert.
# Tests ohne Datenbank laufen ohne Migration; Datenbank-Tests aktivieren sie
# ueber das Testprofil de.trainingsapp.infrastructure.persistenz.MitDatenbank.
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/trainingsapp_test
%test.quarkus.datasource.username=trainingsapp
%test.quarkus.datasource.password=trainingsapp
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.flyway.locations=db/migration,db/test-migration
