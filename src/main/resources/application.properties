quarkus.application.name=trainingsapp-server
# Version kommt aus der pom.xml (Quarkus setzt quarkus.application.version automatisch)

# Kein globaler Root-Pfad: die Version steht im Pfad jeder Ressource (/v1/...),
# damit /v1 und spaetere Versionen parallel betrieben werden koennen.

# OpenAPI
# Dokument: /q/openapi (YAML) bzw. /q/openapi?format=json
# Swagger UI: /q/swagger-ui (standardmaessig nur im Dev- und Test-Modus)
mp.openapi.extensions.smallrye.info.title=Trainingsapp API
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
mp.openapi.extensions.smallrye.info.description=REST-API des Trainingsapp-Backends
# Das Dokument wird beim Build zusaetzlich als Datei abgelegt (target/openapi/)
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# ---------------------------------------------------------------------------
# Persistenz (E9): PostgreSQL, Hibernate ORM mit Panache, Flyway
# Details: docs/persistenz.md
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# Prod: KEINE Zugangsdaten in dieser Datei. URL, Benutzer und Passwort kommen
# ausschliesslich aus Umgebungsvariablen:
#   QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
# Ohne URL wuerde Quarkus die Datasource still abschalten und Flyway die Migration
# ueberspringen. Deshalb prueft infrastructure.persistenz.DatenbankPflichtPruefung beim
# Start, dass die Datasource aktiv ist, und bricht sonst ab.
trainingsapp.datenbank.pflicht=true

# Flyway: Migrationen aus src/main/resources/db/migration werden beim Start angewendet
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Hibernate ORM: das Schema gehoert allein Flyway; Hibernate prueft es nur
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.jdbc.timezone=UTC

# Dev: Quarkus Dev Services startet PostgreSQL im Container (Docker/Podman noetig).
# Keine URL und keine Zugangsdaten hier; Dev Services stellt beides selbst.
# Alternative ohne Container: lokale PostgreSQL per Umgebungsvariablen, siehe docs/persistenz.md.

# Test: Quarkus-Tests ohne Datenbankbezug laufen ohne Datenbank (und ohne Docker).
# Datenbank-Tests schalten Dev Services, Flyway und Hibernate ueber das Testprofil
# de.trainingsapp.infrastructure.persistenz.MitDatenbank ein (Pflicht nach E19).
%test.trainingsapp.datenbank.pflicht=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.flyway.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.locations=db/migration,db/test-migration

# --- S-04: Passkeys (Quarkus WebAuthn) ---
quarkus.webauthn.relying-party.name=Trainingsapp
# Origins (Allowlist) und rpId: Pflicht, sonst leitet die Extension beides aus dem Host-Header ab.
# Geprueft beim Start (infrastructure.passkey.WebAuthnKonfigurationPruefung); dieselbe Liste nutzt
# die Origin-Pruefung fuer schreibende Requests (E15). Prod nur per Umgebungsvariable.
quarkus.webauthn.origins=http://localhost:8080
quarkus.webauthn.relying-party.id=localhost
%test.quarkus.webauthn.origins=http://localhost:8081
%prod.quarkus.webauthn.origins=${TRAININGSAPP_WEBAUTHN_ORIGINS}
%prod.quarkus.webauthn.relying-party.id=${TRAININGSAPP_WEBAUTHN_RP_ID}
# Eingebaute Endpunkte /q/webauthn/register und /q/webauthn/login bleiben aus (Default false);
# wir nutzen nur die programmatische API (WebAuthnSecurity) hinter /v1/...
quarkus.webauthn.enable-registration-endpoint=false
quarkus.webauthn.enable-login-endpoint=false
# Signaturalgorithmen in der Reihenfolge der Empfehlung (WebAuthn L3): EdDSA, ES256, RS256.
# Ohne diese Angabe akzeptiert die Extension nur ES256 und RS256.
quarkus.webauthn.public-key-credential-parameters=EdDSA,ES256,RS256

# Ausstehende Registrierung (S-04, E18): Zwischen Registrierungsoptionen und Abschluss bleibt die
# vorgesehene BenutzerId (User-Handle) fuer den Benutzernamen so lange reserviert (Tabelle
# ausstehende_registrierung). Laenger als die Challenge-Gueltigkeit (quarkus.webauthn.timeout).
trainingsapp.passkey.ausstehende-registrierung-ttl=PT10M

# Gesperrte Benutzernamen (E28), verglichen nach Umwandlung in Kleinschreibung
trainingsapp.benutzername.gesperrt=admin,root,system,support,trainingsapp

# ---------------------------------------------------------------------------
# Zugriffsschutz (E25, E16): /v1/* nur mit Anmeldung, ausser anmelden* und registrieren*.
# Ohne Anmeldung 401 als JSON (infrastructure.http.JsonAnmeldungErforderlich), nie 302,
# auch fuer nicht vorhandene Pfade.
# ---------------------------------------------------------------------------
quarkus.http.auth.permission.v1-oeffentlich.paths=/v1/anmelden,/v1/anmelden/*,/v1/registrieren,/v1/registrieren/*
quarkus.http.auth.permission.v1-oeffentlich.policy=permit
quarkus.http.auth.permission.v1.paths=/v1,/v1/*
quarkus.http.auth.permission.v1.policy=authenticated

# ---------------------------------------------------------------------------
# Cookies, Proxy und Security-Header (E14, E15)
# ---------------------------------------------------------------------------
# HttpOnly und SameSite=Strict setzt infrastructure.http.CookieHaertung immer; Secure in Prod erzwungen.
trainingsapp.cookie.secure=false
%prod.trainingsapp.cookie.secure=${TRAININGSAPP_COOKIE_SECURE}
# Sitzungs- und Challenge-Cookies werden mit diesem Schluessel verschluesselt (mind. 32 Zeichen).
# Ohne Standardwert: fehlt die Variable, scheitert der Start; leer faengt ProdKonfigurationPruefung ab.
%prod.quarkus.http.auth.session.encryption-key=${TRAININGSAPP_SITZUNG_SCHLUESSEL}
# Hinter dem Reverse Proxy: X-Forwarded-* auswerten (Schema fuer Secure, Client-IP fuer das Rate-Limit).
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
# Prod: nur der Proxy darf X-Forwarded-* setzen (sonst liesse sich die IP fuer das Rate-Limit faelschen).
%prod.quarkus.http.proxy.trusted-proxies=${TRAININGSAPP_TRUSTED_PROXIES}
# Strikte CSP: nur eigene Quellen, kein Inline-Skript, keine Einbettung in fremde Seiten.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer

# ---------------------------------------------------------------------------
# Sperre von /q/* im Prod-Profil (E16): 404 ohne Body und ohne Set-Cookie
# (1) Route-Filter infrastructure.http.QPfadSperre, (2) Deny-Policy, (3) Proxy-Regel (S-14)
# ---------------------------------------------------------------------------
trainingsapp.q-sperre=false
%prod.trainingsapp.q-sperre=true
%prod.quarkus.http.auth.permission.q-sperre.paths=/q,/q/*,/.well-known/webauthn
%prod.quarkus.http.auth.permission.q-sperre.policy=deny

# ---------------------------------------------------------------------------
# Rate-Limit je Client-IP (E17): registrieren/optionen, registrieren, anmelden/optionen,
# je Endpunkt hoechstens <anfragen> POST-Anfragen pro <fenster>. Zaehler im Speicher (eine Instanz).
# ---------------------------------------------------------------------------
trainingsapp.rate-limit.anfragen=10
trainingsapp.rate-limit.fenster=PT10M
# Tests registrieren viele Benutzer von 127.0.0.1; das Limit selbst prueft RateLimitTest mit eigenem Profil.
%test.trainingsapp.rate-limit.anfragen=100000
