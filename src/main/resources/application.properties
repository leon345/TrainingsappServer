# Anwendung
quarkus.application.name=trainingsapp-server
quarkus.application.version=0.1.0-SNAPSHOT

# HTTP Sicherheits-Header (Quarkus-Bordmittel)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Content-Security-Policy".value=default-src 'self'

# Management-Interface fuer Health-Endpunkte (nicht auf dem oeffentlichen API-Port)
quarkus.management.enabled=true
quarkus.management.port=9000
%test.quarkus.management.test-port=0

# OpenAPI-Export beim Build
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# Persistenz (PostgreSQL + Hibernate ORM + Flyway)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# Prod-Profil: Keine hartcodierten Zugangsdaten, interne Endpunkte deaktiviert
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.smallrye-openapi.enabled=false
%prod.quarkus.swagger-ui.enabled=false

# Dev-Profil: PostgreSQL Dev Services, OpenAPI/Swagger UI und lokaler Client-Origin
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.smallrye-openapi.enabled=true
%dev.quarkus.smallrye-openapi.management.enabled=false
%dev.quarkus.swagger-ui.enabled=true
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# Test-Profil: PostgreSQL Dev Services und OpenAPI auf Testport aktiv
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.smallrye-openapi.enabled=true
%test.quarkus.smallrye-openapi.management.enabled=false
%test.quarkus.http.test-port=8081
