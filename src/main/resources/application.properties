# Anwendung
quarkus.application.name=trainingsapp-server
quarkus.application.version=0.1.0-SNAPSHOT

# HTTP Sicherheits-Header & Proxy-Weiterleitung (Quarkus-Bordmittel)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Content-Security-Policy".value=default-src 'self'
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.auth.proactive=false

# Passkeys (quarkus-security-webauthn)
quarkus.webauthn.relying-party.name=Trainingsapp
quarkus.webauthn.user-verification=required
quarkus.webauthn.resident-key=required
quarkus.webauthn.attestation=none
quarkus.webauthn.public-key-credential-parameters=ES256,RS256
quarkus.webauthn.cookie-same-site=strict
quarkus.webauthn.enable-registration-endpoint=false
quarkus.webauthn.enable-login-endpoint=false

# Konfigurierbare Benutzernamen-Sperrliste (ergänzt die Pflicht-Sperrliste in der Domain)
trainingsapp.benutzername.sperrliste=admin,root,system,support,trainingsapp

# Management-Interface fuer Health-Endpunkte (nicht auf dem oeffentlichen API-Port)
quarkus.management.enabled=true
quarkus.management.port=9000
%test.quarkus.management.test-port=0

# OpenAPI-Export beim Build
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# Persistenz (PostgreSQL + Hibernate ORM + Flyway)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false

# Prod-Profil: Keine hartcodierten Zugangsdaten/Secrets, interne Endpunkte deaktiviert
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.webauthn.relying-party.id=${WEBAUTHN_RP_ID}
%prod.quarkus.webauthn.origins=${WEBAUTHN_ORIGINS}
%prod.quarkus.http.auth.session.encryption-key=${SESSION_ENCRYPTION_KEY}
%prod.quarkus.smallrye-openapi.enabled=false
%prod.quarkus.swagger-ui.enabled=false

# Dev-Profil: PostgreSQL Dev Services, OpenAPI/Swagger UI und lokaler Client-Origin
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.smallrye-openapi.enabled=true
%dev.quarkus.smallrye-openapi.management.enabled=false
%dev.quarkus.swagger-ui.enabled=true
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.access-control-allow-credentials=true
%dev.quarkus.webauthn.relying-party.id=localhost
%dev.quarkus.webauthn.origins=http://localhost:5173,http://localhost:8080

# Test-Profil: PostgreSQL Dev Services, lokaler WebAuthn-Origin und OpenAPI auf Testport aktiv
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.smallrye-openapi.enabled=true
%test.quarkus.smallrye-openapi.management.enabled=false
%test.quarkus.http.test-port=8081
%test.quarkus.webauthn.relying-party.id=localhost
%test.quarkus.webauthn.origins=http://localhost:8081,https://localhost:8081
%test.de.trainingsapp.api.v1.auth.AuthResource/registrierenOptionen/RateLimit/value=100
%test.de.trainingsapp.api.v1.auth.AuthResource/registrieren/RateLimit/value=100
%test.de.trainingsapp.api.v1.auth.AuthResource/anmeldenOptionen/RateLimit/value=100
