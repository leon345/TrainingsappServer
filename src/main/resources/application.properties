quarkus.application.name=trainingsapp-server
# Version kommt aus der pom.xml (Quarkus setzt quarkus.application.version automatisch)

# Kein globaler Root-Pfad: die Version steht im Pfad jeder Ressource (/v1/...),
# damit /v1 und spaetere Versionen parallel betrieben werden koennen.

# OpenAPI
# Dokument: /q/openapi (YAML) bzw. /q/openapi?format=json
# Swagger UI: /q/swagger-ui (standardmaessig nur im Dev- und Test-Modus)
mp.openapi.extensions.smallrye.info.title=Trainingsapp API
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
mp.openapi.extensions.smallrye.info.description=REST-API des Trainingsapp-Backends
# Das Dokument wird beim Build zusaetzlich als Datei abgelegt (target/openapi/)
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# --- S-04-Spike: Passkeys (Quarkus WebAuthn) ---
quarkus.webauthn.relying-party.name=Trainingsapp
# Eingebaute Endpunkte /q/webauthn/register und /q/webauthn/login bleiben aus (Default false);
# wir nutzen nur die programmatische API (WebAuthnSecurity) hinter /v1/...
quarkus.webauthn.enable-registration-endpoint=false
quarkus.webauthn.enable-login-endpoint=false
